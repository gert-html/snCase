<style>
  input,select,textarea{font-size:16px!important}
:root{box-sizing:border-box}
body{background:#0b0e14;color:#fff;font-family:Inter,system-ui,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
input,select,textarea{user-select:text;-webkit-user-select:text}
.glass{background:rgba(21,28,40,.75);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08)}
.nos::-webkit-scrollbar{display:none}.nos{scrollbar-width:none}
.mask{-webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent)}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.fl{animation:fl 3s ease-in-out infinite}.tw{animation:tw 1.6s infinite;transform-origin:center;transform-box:fill-box}
.rc{transition:transform .2s}.rc:active{transform:scale(.97)}
.inp{width:100%;background:#0d131f;border:1px solid #232e42;border-radius:12px;padding:10px 12px;font-size:14px;color:#fff;outline:none}
.inp:focus{border-color:#22d3ee}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),110vh) rotate(720deg);opacity:.9}}
.cf{position:fixed;top:-12px;width:8px;height:14px;z-index:95;pointer-events:none;animation:cf 2.4s ease-in forwards}
@keyframes shk{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
.shk{animation:shk .5s}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tkr{display:flex;width:max-content;animation:tk 40s linear infinite}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s}
</style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col">
<header class="sticky top-0 z-40 glass px-4 py-3 flex items-center justify-between">
  <div class="flex items-center gap-2 cursor-pointer" onclick="go('home')">
    <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center font-black text-sm">sn</div>
    <span class="font-black tracking-wider text-base text-cyan-200">snCase</span>
  </div>
  <div class="flex items-center gap-2 text-xs font-black">
    <div class="bg-slate-800/80 border border-slate-700 px-2.5 py-1 rounded-full">🪙 <span id="b-coins"></span></div>
    <div class="bg-amber-500/20 border border-amber-500/40 px-2.5 py-1 rounded-full text-amber-300">⭐ <span id="b-stars"></span></div>
  </div>
</header>
<main id="main" class="flex-1 px-4 py-4 pb-28"></main>
<nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-40 glass px-1 py-2 flex justify-around" style="padding-bottom:calc(.5rem + env(safe-area-inset-bottom,0px))">
  <button id="n-home" onclick="go('home')" class="relative flex flex-col items-center text-[10px] font-bold px-2">📦<span>КЕЙСИ</span></button>
  <button id="n-games" onclick="go('games')" class="relative flex flex-col items-center text-[10px] font-bold px-2">🎡<span>СПІН</span></button>
  <button id="n-trade" onclick="go('trade')" class="relative flex flex-col items-center text-[10px] font-bold px-2">🔁<span>ТРЕЙД</span><b id="tbadge" style="display:none" class="absolute -top-1 -right-1 min-w-[16px] h-4 px-1 rounded-full bg-red-500 text-white text-[9px] items-center justify-center">0</b></button>
  <button id="n-top" onclick="go('top')" class="relative flex flex-col items-center text-[10px] font-bold px-2">🏆<span>ТОП</span></button>
  <button id="n-bonuses" onclick="go('bonuses')" class="relative flex flex-col items-center text-[10px] font-bold px-2">🎁<span>БОНУСИ</span></button>
  <button id="n-profile" onclick="go('profile')" class="relative flex flex-col items-center text-[10px] font-bold px-2">👤<span>ІНВЕНТАР</span></button>
</nav>
<div id="ov" style="display:none" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md items-center justify-center p-4">

function odds(c){
  const cnt={};
  c.items.forEach(i=>{const it=ITEMS[i];if(!it.sw)cnt[it.rarity]=(cnt[it.rarity]||0)+1});
  const P={...RW},low=RAR.find(r=>cnt[r]);
  RAR.forEach(r=>{if(!cnt[r]){P[low]+=P[r];P[r]=0}});
  const sx=c.items.reduce((s,i)=>s+(ITEMS[i].sw||0),0);
  if(cnt.mythic)P.mythic=Math.max(0,P.mythic-sx);
  return c.items.map(i=>{
    const it=ITEMS[i],w=it.sw||P[it.rarity]/cnt[it.rarity];
    return {...it,w,chance:w};
  });
}

function cyrb(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,ch;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
async function hashPw(salt,pw,m){
  const t=salt+':'+pw;
  if(m==='s'){if(!canSub)return null;const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

}

async function tAct(id,mode){
  const ref=ON.db.doc('trades/'+id);let msg='';

    const t=(await ref.get()).data();

    else if(mode==='cancel'){if(t.from!==ON.uid)return;await ref.update({st:'cancelled'});msg='Скасовано'}
    else if(t.to!==ON.uid)return;
    else if(mode==='decline'){await ref.update({st:'declined'});msg='Відхилено'}

      const ok=t.ask.every(a=>S.inv.some(x=>x.uid===a.uid&&x.id===a.id))&&S.stars+(t.gs|0)>=(t.stars|0);
      if(!ok){await ref.update({st:'declined'});msg='❌ Бракує предметів або Stars -- офер відхилено'}
      else{
        S.inv=S.inv.filter(x=>!t.ask.some(a=>a.uid===x.uid));
        let n=nid(S);t.give.forEach(g=>S.inv.push({id:g,uid:n++}));

        await ref.update({st:'accepted'});msg='✅ Обмін виконано'

const ARR={trades:['give','ask','involved'],players:['inv','fav']};
function rtNorm(path,v){
  if(v==null||typeof v!=='object')return v;
  (ARR[path.split('/')[0]]||[]).forEach(k=>{
    const a=v[k];
    if(a==null)v[k]=[];else if(!Array.isArray(a))v[k]=Object.values(a);
  });
  return v;
}
const rtClean=d=>JSON.parse(JSON.stringify(d));
function rtTx(ref,path,fn){
  let old=null;
  return ref.transaction(cur=>{
    if(cur===null)return cur;
    const c=rtNorm(path,rtClean(cur)),r=fn(c);
    if(r===undefined)return;
    old=c;return r;
  },undefined,false).then(res=>res.committed?old:null);
}
function rtDoc(path){
  const ref=firebase.database().ref(path);
  const snap=s=>({exists:s.exists(),id:s.key,data:()=>rtNorm(path,s.val())});
  return {
    get:async()=>snap(await ref.once('value')),
    set:(d,o)=>o&&o.merge?ref.update(rtClean(d)):ref.set(rtClean(d)),
    update:d=>ref.update(rtClean(d)),
    onSnapshot:(cb,er)=>{const f=s=>cb(snap(s));ref.on('value',f,er||(()=>{}));return()=>ref.off('value',f)},
    tx:fn=>rtTx(ref,path,fn)
  };
}
function rtQuery(name,st){
  const base=firebase.database().ref(name);
  const cp=o=>rtQuery(name,Object.assign({},st,o));
  const qs=s=>{const docs=[];s.forEach(c=>{docs.push({id:c.key,data:()=>rtNorm(name,c.val())})});return docs};
  const merge=arr=>{const m=new Map();arr.forEach(a=>a.forEach(d=>m.set(d.id,d)));const docs=[...m.values()];return{docs,size:docs.length,empty:!docs.length}};
  const srcs=()=>{
    if(st.has)return [base.orderByChild('from').equalTo(st.has),base.orderByChild('to').equalTo(st.has)];
    let q=base;
    if(st.eq)q=q.orderByChild(st.eq[0]).equalTo(st.eq[1]);else if(st.ord)q=q.orderByChild(st.ord);
    if(st.last)q=q.limitToLast(st.last);
    if(st.first)q=q.limitToFirst(st.first);
    return [q];
  };
  return {
    where:(f,op,v)=>op==='array-contains'?cp({has:v}):cp({eq:[f,v]}),
    orderBy:f=>cp({ord:f}),
    limit:n=>cp({first:n}),
    limitToLast:n=>cp({last:n}),
    add:d=>base.push().set(rtClean(d)),
    get:async()=>merge((await Promise.all(srcs().map(q=>q.once('value')))).map(s=>qs(s))),
    onSnapshot:(cb,er)=>{
      const Q=srcs(),R=new Array(Q.length).fill(null);
      const F=Q.map((q,i)=>{const f=s=>{R[i]=qs(s);if(R.every(Boolean))cb(merge(R))};q.on('value',f,er||(()=>{}));return f});
      return()=>Q.forEach((q,i)=>q.off('value',F[i]));
    }
  };
}

tAct=async function(id,mode){
  if(ON.busy)return;ON.busy=1;let msg='';
  const fs=firebase.firestore(),ref=fs.doc('trades/'+id);
  /* атомарна зміна статусу: спрацює лише якщо офер ще pending */
  const flip=st=>fs.runTransaction(async tx=>{const s=await tx.get(ref),t=s.data();if(!t||t.st!=='pending')return null;tx.update(ref,{st});return t});
  try{
    const cur=(await ref.get()).data();
    if(!cur||cur.st!=='pending')msg='Офер уже недоступний';
    else if(mode==='cancel'){if(cur.from!==ON.uid)return;msg=(await flip('cancelled'))?'Скасовано':'Офер уже недоступний'}
    else if(cur.to!==ON.uid)return;
    else if(mode==='decline'){msg=(await flip('declined'))?'Відхилено':'Офер уже недоступний'}
    else{
      const ok=cur.ask.every(a=>S.inv.some(x=>x.uid===a.uid&&x.id===a.id))&&S.stars+(cur.gs|0)>=(cur.stars|0);
      if(!ok){await flip('declined');msg='❌ Бракує предметів або Stars -- офер відхилено'}
      else{
        const t=await flip('accepted');
        if(!t)msg='Офер уже недоступний';
        else{
          S.inv=S.inv.filter(x=>!t.ask.some(a=>a.uid===x.uid));
          let n=nid(S);t.give.forEach(g=>S.inv.push({id:g,uid:n++}));
          S.stars+=(t.gs|0)-(t.stars|0);save();msg='✅ Обмін виконано';
        }
      }
    }
  }catch(e){msg='❌ Помилка мережі'}
  finally{ON.busy=0}
  toast(msg);renderTrades($('main'));
};

}

  <div class="flex gap-2 text-[9px] font-black text-slate-400"><span class="w-6">LV</span><span class="flex-1 text-center">FREE</span><span class="flex-1 text-center">PREMIUM (рівні 5,10… = кейс, 30 = Genesis Crown)</span></div>

async function mkList(uid){

async function mkBuy(id){

  const ref=ON.db.doc('market/'+id);let ok=false;
  try{ok=await firebase.firestore().runTransaction(async tx=>{const s=await tx.get(ref),d=s.data();if(!d||d.st!=='open')return false;tx.update(ref,{st:'sold',buyer:ON.uid});return true})}catch(e){ok=false}
  if(ok){S.inv.push({id:l.item.id,uid:nid(S)});save();confetti(25);toast('✅ Куплено: '+ITEMS[l.item.id].name)}
  else{S.stars+=l.price;save();toast('❌ Лот недоступний')}
  MK.busy=0;mRender();
}
async function mkCancel(id){
  const ref=ON.db.doc('market/'+id);
  try{await firebase.firestore().runTransaction(async tx=>{const s=await tx.get(ref),d=s.data();if(!d||d.st!=='open'||d.seller!==ON.uid)return;tx.update(ref,{st:'cancelled'})});toast('↩️ Лот знято')}
  catch(e){toast('❌ Помилка')}
}
/* продавець забирає результат: продано -> 95% ціни, знято -> предмет назад */
function mkSettle(){
  ON.mine.forEach(l=>{
    if(l.claimed||l.st==='open'||ON.mkc[l.id])return;ON.mkc[l.id]=1;
    const ref=ON.db.doc('market/'+l.id);
    firebase.firestore().runTransaction(async tx=>{const s=await tx.get(ref),d=s.data();if(!d||d.claimed||d.st==='open')return null;tx.update(ref,{claimed:true});return d})
    .then(d=>{if(!d)return;
      if(d.st==='sold'){const g=Math.floor(d.price*.95);S.stars+=g;toast('💰 Продано: +⭐ '+fmt(g))}
      else{S.inv.push({id:d.item.id,uid:nid(S)});toast('↩️ Предмет повернуто')}
      save()})
    .catch(()=>{delete ON.mkc[l.id]});
  });
}

/* ================= 5. БАТЛ З БОТОМ ================= */
const BT={c:'meme',r:1,res:null};
function btHTML(){
  const L=CASES.filter(c=>c.price>0&&!c.nb),c=cs(BT.c)||L[0];
  return `<div class="glass rounded-3xl p-4 space-y-3"><div class="text-center"><h2 class="text-sm font-black tracking-widest text-red-300">⚔️ БАТЛ З БОТОМ</h2><p class="text-[10px] text-slate-400">Обидва відкривають однаковий кейс. Дорожчий дроп забирає ВСЕ. Нічия — свої предмети лишаються тобі.</p></div>
  <select class="inp" onchange="BT.c=this.value;BT.res=null;mRender()">${L.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.name} · ⭐${x.price}</option>`).join('')}</select>
  <div class="flex justify-center gap-2">${[1,2,3].map(n=>`<button onclick="BT.r=${n};BT.res=null;mRender()" class="px-3 py-1 rounded-xl text-xs font-black ${BT.r===n?'bg-red-500 text-black':'bg-slate-800 text-slate-300'}">${n} раунд${n>1?'и':''}</button>`).join('')}</div>
  <button onclick="btGo()" class="w-full py-3 rounded-2xl bg-gradient-to-r from-red-500 to-orange-500 text-black font-black text-xs uppercase active:scale-95 transition">ПОЧАТИ БАТЛ ЗА ⭐ ${fmt(c.price*BT.r)}</button>
  <div id="btr"></div></div>`;
}
function btShow(){
  const e=$('btr');if(!e||!BT.res)return;const R=BT.res;
  const col=(arr,sc)=>`<div class="flex-1 bg-slate-800/50 rounded-2xl p-2 space-y-1.5 text-center">${arr.slice(0,R.show).map(i=>`<div class="pop flex items-center gap-1.5"><div class="w-9 h-9 shrink-0">${art(i)}</div><div class="text-left overflow-hidden"><div class="text-[9px] font-black truncate">${esc(i.name)}</div><div class="text-[9px] text-amber-300 font-bold">⭐ ${fmt(i.val)}</div></div></div>`).join('')}${R.done?`<div class="text-[11px] font-black text-amber-300 pt-1">Σ ⭐ ${fmt(sc)}</div>`:''}</div>`;
  e.innerHTML=`<div class="flex gap-2 text-[9px] font-black text-slate-400"><span class="flex-1 text-center">ТИ</span><span class="flex-1 text-center">🤖 БОТ</span></div><div class="flex gap-2">${col(R.me,R.sm)}${col(R.bot,R.sb)}</div>
  ${R.done?`<div class="text-center text-sm font-black mt-2 ${R.out==='win'?'text-green-400':R.out==='draw'?'text-slate-300':'text-red-400'}">${R.out==='win'?'🏆 ПЕРЕМОГА! Забираєш усе':R.out==='draw'?'🤝 НІЧИЯ — свої предмети твої':'💥 ПРОГРАШ'}</div>`:''}`;
}
function btGo(){
  if(S.spin)return;const c=cs(BT.c);if(!c||c.price<=0)return;
  const cost=c.price*BT.r;if(S.stars<cost)return toast('❌ Недостатньо Stars ⭐');
  S.stars-=cost;S.spin=true;save();
  const me=[],bot=[];for(let i=0;i<BT.r;i++){me.push(roll(c));bot.push(roll(c))}
  BT.res={me,bot,sm:me.reduce((s,i)=>s+i.val,0),sb:bot.reduce((s,i)=>s+i.val,0),show:0,done:false};btShow();
  const tm=setInterval(()=>{
    BT.res.show++;btShow();AU.tick();
    if(BT.res.show>=BT.r){clearInterval(tm);setTimeout(btEnd,700)}
  },800);
}
function btEnd(){
  const R=BT.res;R.done=true;
  R.out=R.sm>R.sb?'win':R.sm===R.sb?'draw':'lose';
  const give=R.out==='win'?R.me.concat(R.bot):R.out==='draw'?R.me:[];
  give.forEach(i=>S.inv.push({id:i.id,uid:nid(S)}));
  S.opened+=BT.r;S.spin=false;qAdd('battle');
  if(R.out==='win'){AU.win('epic');confetti(40)}else AU.tone(R.out==='draw'?220:110,0,.5,'square',.1);
  save();btShow();addXP(20*BT.r);
}

/* ================= 6. МІНІ-ІГРИ: МІНЕР + КРАШ ================= */
const MN={bet:100,m:3,on:false,open:[],mines:[],k:0,cur:0,msg:''};
const mnMult=(k,m)=>{let x=.96;for(let i=0;i<k;i++)x*=(25-i)/(25-m-i);return x};
function gmHTML(){return `<div id="mn" class="glass p-4 rounded-3xl space-y-3 text-center"></div><div id="cr" class="glass p-4 rounded-3xl space-y-3 text-center mt-3"></div>`}
function mnDraw(){
  const e=$('mn');if(!e)return;const fin=!MN.on&&MN.mines.length;
  let cells='';
  for(let i=0;i<25;i++){
    const op=MN.open.includes(i),mi=MN.mines.includes(i);
    cells+=`<button ${MN.on&&!op?'':'disabled'} onclick="mnPick(${i})" class="aspect-square rounded-xl text-xl font-black ${op?'bg-green-500/30 border border-green-400':fin&&mi?'bg-red-600/40 border border-red-500':'bg-slate-800 border border-slate-700'}">${op?'💎':fin&&mi?'💣':''}</button>`;
  }
  const mult=mnMult(MN.k,MN.m);
  e.innerHTML=`<h2 class="text-sm font-black tracking-widest text-green-300">💣 МІНЕР</h2><p class="text-[10px] text-slate-400">Відкривай 💎, уникай 💣. Множник росте з кожним кроком.</p>
  <div class="grid grid-cols-5 gap-1.5">${cells}</div>
  ${MN.on?`<div class="text-xs font-black text-amber-300">x${mult.toFixed(2)} · ⭐ ${fmt(Math.floor(MN.cur*mult))}</div><button onclick="mnCash()" ${MN.k?'':'disabled'} class="w-full py-3 rounded-2xl bg-green-400 text-black font-black text-xs ${MN.k?'':'opacity-40'}">ЗАБРАТИ</button>`:
  `<div class="text-[11px] font-black ${MN.msg.startsWith('💥')?'text-red-400':'text-green-300'}">${MN.msg}</div>
  <div class="flex justify-center gap-2">${[1,3,5,10].map(n=>`<button onclick="MN.m=${n};mnDraw()" class="px-3 py-1 rounded-xl text-xs font-black ${MN.m===n?'bg-green-400 text-black':'bg-slate-800 text-slate-300'}">${n} 💣</button>`).join('')}</div>
  <div class="flex gap-2"><input type="number" min="1" class="inp" value="${MN.bet}" oninput="MN.bet=Math.max(1,parseInt(this.value)||1)"><button onclick="mnStart()" class="px-5 rounded-xl bg-green-400 text-black font-black text-xs">СТАРТ</button></div>`}`;
}
function mnStart(){
  if(S.spin||MN.on)return;const b=MN.bet|0;
  if(b<1||b>S.stars)return toast('❌ Недостатньо Stars');
  S.stars-=b;S.spin=true;MN.on=true;MN.cur=b;MN.k=0;MN.open=[];MN.msg='';
  const pool=[...Array(25).keys()];MN.mines=[];
  for(let i=0;i<MN.m;i++)MN.mines.push(pool.splice(Math.random()*pool.length|0,1)[0]);
  qAdd('game');save();mnDraw();
}
function mnPick(i){
  if(!MN.on||MN.open.includes(i))return;
  if(MN.mines.includes(i)){
    MN.on=false;S.spin=false;MN.msg='💥 Міна! −⭐ '+fmt(MN.cur);
    AU.tone(110,0,.5,'square',.1);shake();save();mnDraw();return;
  }
  MN.open.push(i);MN.k++;AU.tick();
  if(MN.k>=25-MN.m)return mnCash();
  mnDraw();
}
function mnCash(){
  if(!MN.on||!MN.k)return;
  const w=Math.floor(MN.cur*mnMult(MN.k,MN.m));
  S.stars+=w;MN.on=false;S.spin=false;MN.msg='🎉 Забрано ⭐ '+fmt(w)+' (x'+mnMult(MN.k,MN.m).toFixed(2)+')';
  AU.win('rare');confetti(25);save();mnDraw();
}

const CR={bet:100,auto:0,on:false,x:1,pt:1,t0:0,cur:0,msg:''};
function crDraw(){
  const e=$('cr');if(!e)return;
  e.innerHTML=`<h2 class="text-sm font-black tracking-widest text-orange-300">📈 КРАШ</h2><p class="text-[10px] text-slate-400">Множник росте — встигни забрати до краху.</p>
  <div id="crx" class="text-4xl font-black ${CR.on?'text-amber-300':'text-slate-300'}">${CR.x.toFixed(2)}x</div>
  ${CR.on?`<button id="crb" onclick="crCash()" class="w-full py-3 rounded-2xl bg-orange-400 text-black font-black text-xs">ЗАБРАТИ ⭐ ${fmt(Math.floor(CR.cur*CR.x))}</button>`:
  `<div class="text-[11px] font-black ${CR.msg.startsWith('💥')?'text-red-400':'text-green-300'}">${CR.msg}</div>
  <div class="flex gap-2"><input type="number" min="1" class="inp" value="${CR.bet}" oninput="CR.bet=Math.max(1,parseInt(this.value)||1)"><input type="number" step="0.1" min="0" class="inp" value="${CR.auto||''}" placeholder="авто x" oninput="CR.auto=parseFloat(this.value)||0"><button onclick="crStart()" class="px-4 rounded-xl bg-orange-400 text-black font-black text-xs">СТАРТ</button></div>`}`;
}
function crStart(){
  if(S.spin||CR.on)return;const b=CR.bet|0;
  if(b<1||b>S.stars)return toast('❌ Недостатньо Stars');
  S.stars-=b;S.spin=true;CR.on=true;CR.cur=b;CR.x=1;CR.msg='';
  const r=Math.random();CR.pt=Math.min(1000,Math.max(1,Math.floor(96/(1-r))/100)); /* 4% перевага казино */
  CR.t0=performance.now();qAdd('game');save();crDraw();requestAnimationFrame(crLoop);
}
const crX=()=>Math.exp((performance.now()-CR.t0)*0.00035);
function crLoop(){
  if(!CR.on)return;
  const x=crX();
  if(x>=CR.pt){CR.x=CR.pt;return crEnd(false)}
  CR.x=x;
  if(CR.auto>1.01&&x>=CR.auto)return crCash(CR.auto);
  const a=$('crx');if(a)a.textContent=x.toFixed(2)+'x';
  const b=$('crb');if(b)b.textContent='ЗАБРАТИ ⭐ '+fmt(Math.floor(CR.cur*x));
  requestAnimationFrame(crLoop);
}
function crCash(fx){
  if(!CR.on)return;
  const x=fx||crX();
  if(x>=CR.pt){CR.x=CR.pt;return crEnd(false)}
  CR.x=x;crEnd(true,Math.floor(CR.cur*x));
}
function crEnd(win,w){
  CR.on=false;S.spin=false;
  if(win){S.stars+=w;CR.msg='🎉 Забрано ⭐ '+fmt(w)+' на x'+CR.x.toFixed(2);AU.win('rare');confetti(25)}
  else{CR.msg='💥 КРАШ на x'+CR.pt.toFixed(2)+' · −⭐ '+fmt(CR.cur);AU.tone(110,0,.5,'square',.1);shake()}
  save();crDraw();
}

/* ================= 7. ЗАГАЛЬНИЙ ЧАТ ================= */
const GC={unsub:null,msgs:[],last:0,first:true,err:false};
function gcHTML(){
  if(!ON.ready)return offl();GC.first=true;
  return `<div class="glass rounded-3xl p-3 flex flex-col" style="height:min(65vh,480px)"><div class="text-xs font-black text-center text-cyan-300 pb-2">🌍 ЗАГАЛЬНИЙ ЧАТ</div><div id="gcm" class="flex-1 overflow-y-auto nos space-y-1.5"></div>
  <div class="flex gap-2 pt-2"><input id="gci" class="inp" maxlength="200" placeholder="Повідомлення всім..." autocomplete="off" onkeydown="if(event.key==='Enter')gcSend()"><button onclick="gcSend()" class="px-4 rounded-xl bg-cyan-500 text-black font-black text-xs">➤</button></div></div>`;
}
function gcSub(){
  if(GC.unsub||!ON.ready)return;
  GC.unsub=ON.db.collection('global').orderBy('ts').limitToLast(60).onSnapshot(s=>{GC.err=false;GC.msgs=s.docs.map(d=>d.data());gcDraw()},()=>{GC.err=true;gcDraw()});
}
function gcDraw(){
  const b=$('gcm');if(!b)return;
  if(GC.err){b.innerHTML='<div class="text-center text-[10px] text-red-400 py-6">Не вдалося завантажити чат (перевір правила Firestore)</div>';return}
  const near=b.scrollHeight-b.scrollTop-b.clientHeight<80;
  b.innerHTML=GC.msgs.length?GC.msgs.map(m=>{
    const me=m.from===ON.uid,t=new Date(m.ts||Date.now()),p=ON.players[m.from];
    return `<div class="flex ${me?'justify-end':'justify-start'} items-end gap-1.5">${me?'':avaHTML(p||{},24)}<div class="max-w-[78%] rounded-2xl px-3 py-1.5 text-[12px] ${me?'bg-cyan-500 text-black':'bg-slate-800 text-white'}" style="user-select:text;-webkit-user-select:text;word-break:break-word">${me?'':`<div class="text-[9px] font-black text-cyan-300 cursor-pointer" onclick="showPlayer('${esc(m.from)}')">${esc(m.name||'Гравець')}</div>`}${esc(m.text)}<div class="text-[8px] opacity-60 text-right">${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</div></div></div>`;
  }).join(''):'<div class="text-center text-[10px] text-slate-500 py-8">Напиши першим 👋</div>';
  if(near||GC.first)b.scrollTop=b.scrollHeight;GC.first=false;
}
async function gcSend(){
  const i=$('gci');if(!i||!ON.ready)return;
  const t=i.value.trim().slice(0,200),now=Date.now();
  if(!t||now-GC.last<1500)return;GC.last=now;i.value='';
  try{await ON.db.collection('global').add({from:ON.uid,name:(users()[ME]||{}).n||'Player',text:t,ts:now})}

/* ===== RTDB: транзакції трейдів і маркету ===== */
tAct=async function(id,mode){
  if(ON.busy)return;ON.busy=1;let msg='';
  const ref=ON.db.doc('trades/'+id);
  const flip=st=>ref.tx(t=>t.st==='pending'?{...t,st}:undefined);
  try{
    const cur=(await ref.get()).data();
    if(!cur||cur.st!=='pending')msg='Офер уже недоступний';
    else if(mode==='cancel'){if(cur.from!==ON.uid)return;msg=(await flip('cancelled'))?'Скасовано':'Офер уже недоступний'}
    else if(cur.to!==ON.uid)return;
    else if(mode==='decline'){msg=(await flip('declined'))?'Відхилено':'Офер уже недоступний'}
    else{
      const ok=cur.ask.every(a=>S.inv.some(x=>x.uid===a.uid&&x.id===a.id))&&S.stars+(cur.gs|0)>=(cur.stars|0);
      if(!ok){await flip('declined');msg='❌ Бракує предметів або Stars -- офер відхилено'}
      else{
        const t=await flip('accepted');
        if(!t)msg='Офер уже недоступний';
        else{
          S.inv=S.inv.filter(x=>!t.ask.some(a=>a.uid===x.uid));
          let n=nid(S);t.give.forEach(g=>S.inv.push({id:g,uid:n++}));
          S.stars+=(t.gs|0)-(t.stars|0);save();msg='✅ Обмін виконано';
        }
      }
    }
  }catch(e){console.error(e);msg='❌ '+(e.code||'Помилка мережі')}
  finally{ON.busy=0}
  toast(msg);renderTrades($('main'));
};
mkBuy=async function(id){
  if(MK.busy)return;const l=ON.mk.find(x=>x.id===id);if(!l||l.seller===ON.uid)return;
  if(S.stars<l.price)return toast('❌ Недостатньо Stars');
  MK.busy=1;S.stars-=l.price;save();
  let ok=false;
  try{ok=!!(await ON.db.doc('market/'+id).tx(d=>d.st==='open'?{...d,st:'sold',buyer:ON.uid}:undefined))}
  catch(e){console.error(e);toast('❌ '+(e.code||'помилка'))}
  if(ok){S.inv.push({id:l.item.id,uid:nid(S)});save();confetti(25);toast('✅ Куплено: '+ITEMS[l.item.id].name)}
  else{S.stars+=l.price;save();toast('❌ Лот недоступний')}
  MK.busy=0;mRender();
};
mkCancel=async function(id){
  try{
    const o=await ON.db.doc('market/'+id).tx(d=>(d.st==='open'&&d.seller===ON.uid)?{...d,st:'cancelled'}:undefined);
    toast(o?'↩️ Лот знято':'Лот уже недоступний');
  }catch(e){console.error(e);toast('❌ '+(e.code||'помилка'))}
};
mkSettle=function(){
  ON.mine.forEach(l=>{
    if(l.claimed||l.st==='open'||ON.mkc[l.id])return;ON.mkc[l.id]=1;
    ON.db.doc('market/'+l.id).tx(d=>(!d.claimed&&d.st!=='open')?{...d,claimed:true}:undefined)
    .then(d=>{if(!d)return;
      if(d.st==='sold'){const g=Math.floor(d.price*.95);S.stars+=g;toast('💰 Продано: +⭐ '+fmt(g))}
      else{S.inv.push({id:d.item.id,uid:nid(S)});toast('↩️ Предмет повернуто')}
      save()})
    .catch(()=>{delete ON.mkc[l.id]});
  });
};

.chip-star{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.45);color:#fde68a;box-shadow:0 0 16px -6px rgba(251,191,36,.7)}
.chip-lv{border-color:rgba(34,211,238,.4);color:#67e8f9}
.chip.bump{animation:bump .4s}
@media(max-width:380px){.chip-lv{display:none}}

/* ---- нижня навігація: плаваюча капсула ---- */
nav.glass{left:10px!important;right:10px!important;bottom:calc(8px + env(safe-area-inset-bottom,0px))!important;
 border-radius:26px;padding-bottom:.5rem!important;
 background:linear-gradient(180deg,rgba(24,34,56,.86),rgba(10,15,28,.92));
 box-shadow:0 20px 50px -10px rgba(0,0,0,.95),0 0 0 1px rgba(34,211,238,.08),inset 0 1px 0 rgba(255,255,255,.1)}
nav button{font-size:18px!important;line-height:1.1;padding:4px 0!important;border-radius:16px;min-width:0;transition:transform .25s,color .2s,background .25s}
nav button span{font-size:7.5px;font-weight:800;letter-spacing:.03em;margin-top:2px;opacity:.9}
nav button.text-cyan-400{color:#67e8f9!important;transform:translateY(-4px);
 background:radial-gradient(circle at 50% 30%,rgba(34,211,238,.2),transparent 70%)}
nav button.text-cyan-400::after{content:"";position:absolute;bottom:-2px;left:50%;width:18px;height:3px;border-radius:3px;transform:translateX(-50%);
 background:linear-gradient(90deg,#22d3ee,#a78bfa);box-shadow:0 0 10px #22d3ee}

/* ---- заголовки ---- */
main h2{font-family:'Unbounded',Inter,system-ui,sans-serif;font-size:.8rem!important;font-weight:800;letter-spacing:.05em!important;text-shadow:0 0 22px rgba(255,255,255,.12)}
main h2.mb-3{display:flex;align-items:center;gap:10px;color:#e2e8f0}
main h2.mb-3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(34,211,238,.45),transparent)}

/* ---- старі картки кейсів ---- */
main [onclick^="go('case'"]:not(.fcard){position:relative;overflow:hidden;border-radius:22px!important;border:1px solid rgba(34,211,238,.22)!important;
 background:linear-gradient(180deg,rgba(28,40,66,.9),rgba(8,12,22,.95))!important;
 box-shadow:0 14px 30px -16px #000,inset 0 1px 0 rgba(255,255,255,.08);transition:transform .25s,box-shadow .25s,border-color .25s}
main [onclick^="go('case'"]:not(.fcard):hover{border-color:rgba(34,211,238,.6)!important;box-shadow:0 18px 40px -14px rgba(34,211,238,.5)}
main [onclick^="go('case'"]:not(.fcard)::after{content:"";position:absolute;top:-50%;left:-80%;width:45%;height:200%;pointer-events:none;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.09),transparent);transform:rotate(15deg);animation:fsh 7s ease-in-out infinite}

/* ---- кнопки: блиск + свічення ---- */
button[class*="bg-gradient-to-r"]{position:relative;overflow:hidden}
button[class*="bg-gradient-to-r"]::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.4s infinite}
button.from-amber-400{box-shadow:0 10px 26px -10px rgba(251,191,36,.75)}
button.from-cyan-500{box-shadow:0 10px 26px -10px rgba(34,211,238,.7)}
button.from-fuchsia-500{box-shadow:0 10px 26px -10px rgba(217,70,239,.7)}
button.from-red-500{box-shadow:0 10px 26px -10px rgba(239,68,68,.7)}
button.from-orange-400{box-shadow:0 10px 26px -10px rgba(251,146,60,.7)}
button{transition:transform .15s,filter .15s,background-color .2s}
button:not(:disabled):active{transform:scale(.96)}
button:disabled{cursor:not-allowed}

/* ---- інпути, XP, тости, модалки ---- */
.inp{background:rgba(8,13,24,.8)!important;border-color:rgba(148,163,184,.18)!important;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:#22d3ee!important;box-shadow:0 0 0 3px rgba(34,211,238,.18),0 0 24px -6px rgba(34,211,238,.6)}
main .from-cyan-400.to-amber-400{box-shadow:0 0 12px rgba(34,211,238,.6)}
main .rounded-2xl.bg-gradient-to-b{box-shadow:0 10px 22px -14px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.07)}
body>div[class*="bg-cyan-500"][class*="rounded-full"]{background:linear-gradient(135deg,#22d3ee,#60a5fa)!important;color:#04121f!important;
 box-shadow:0 12px 30px -8px rgba(34,211,238,.75);animation:toastIn .35s cubic-bezier(.2,1.4,.4,1)}
#ov{background:radial-gradient(circle at 50% 40%,rgba(34,211,238,.14),rgba(0,0,0,.88) 70%)!important}
#mc{position:relative;background:linear-gradient(160deg,#1a2438,#0d1320)!important;border-color:rgba(34,211,238,.28)!important;
 box-shadow:0 30px 80px -20px #000}
#mc::before{content:"";position:absolute;inset:-2px;border-radius:inherit;z-index:-1;filter:blur(16px);opacity:.55;
 background:conic-gradient(from var(--ang),#22d3ee,#d946ef,#facc15,#22d3ee);animation:angs 6s linear infinite}
#auth{background:radial-gradient(80% 50% at 50% 0%,rgba(34,211,238,.18),transparent),radial-gradient(60% 40% at 90% 90%,rgba(217,70,239,.16),transparent),#070a12!important}

/* ---- смуга відкриття кейса ---- */
.mask{position:relative}
.mask::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);z-index:5;pointer-events:none;
 background:linear-gradient(transparent,#22d3ee,transparent);box-shadow:0 0 14px #22d3ee}
.rcard{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 6px 14px -8px #000}

/* ---- поява екрана при переході ---- */
#main.rise>div>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}
#main.rise>div>*:nth-child(2){animation-delay:.06s}
#main.rise>div>*:nth-child(3){animation-delay:.12s}
#main.rise>div>*:nth-child(4){animation-delay:.18s}
#main.rise>div>*:nth-child(5){animation-delay:.24s}
#main.rise>div>*:nth-child(n+6){animation-delay:.3s}

const TW={};
function tweenNum(id,to){
  const el=document.getElementById(id);if(!el)return;
  const from=TW[id]==null?to:TW[id];
  cancelAnimationFrame(TW[id+'r']);
  if(from===to){TW[id]=to;el.textContent=to.toLocaleString();return}
  el.textContent=from.toLocaleString();
  const chip=el.parentElement;
  if(to>from&&chip){chip.classList.remove('bump');void chip.offsetWidth;chip.classList.add('bump')}
  const t0=performance.now(),d=650;
  const f=ts=>{
    const p=Math.min(1,(ts-t0)/d),v=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));
    el.textContent=v.toLocaleString();TW[id]=v;
    if(p<1)TW[id+'r']=requestAnimationFrame(f);
  };
  TW[id+'r']=requestAnimationFrame(f);
}
const _hdr6=hdr;
hdr=function(){
  _hdr6();
  tweenNum('b-stars',S.stars);tweenNum('b-coins',S.coins);
  const l=document.getElementById('b-lvl');if(l)l.textContent=lvlOf(S.xp);
};

(function(){

const ADM=window.ADM;
Object.assign(ON,{nws:[],nwFirst:true,cd11:{}});
S.ac=S.ac||{};

/* ---------------------------------------------------------------
   1. ФІКС "ПРИБРАТИ З ТОПУ": раніше адмін бачив усіх гравців (обхід фільтра),
      тому здавалось, що кнопка не працює. Тепер фільтр діє для всіх,
      а в адмін-панелі гравці лишаються видимі (з позначкою 🙈 / 🚫).
---------------------------------------------------------------- */
const vis2=P=>{const o={};for(const k in P){const f=ON.fl&&ON.fl[k];if(f&&(f.hide||f.ban))continue;o[k]=P[k]}return o};
Object.defineProperty(ON,'players',{configurable:true,enumerable:true,
  get(){return ON._pv||{}},
  set(v){ON._raw=v||{};ON._pv=vis2(ON._raw)}});
ON.players=ON._raw||{};

/* ---------------------------------------------------------------
   2. АДМІН-ДІЇ ПРАЦЮЮТЬ І ДЛЯ ОФЛАЙН-ГРАВЦІВ
      - дія одразу записується прямо в документ гравця (players/uid) транзакцією
      - паралельно кладеться в чергу cmd2/uid: якщо гравець ОНЛАЙН, його клієнт
        застосує зміну локально (інакше він перезаписав би документ старим станом)
      - ключ дії (ac) захищає від подвійного застосування
---------------------------------------------------------------- */
async function admTx(k,key,c){
  let applied=false;
  const r=await firebase.database().ref('players/'+k).transaction(cur=>{
    if(cur===null)return cur;
    if(cur.ac&&cur.ac[key]){applied=true;return cur}
    let inv=Array.isArray(cur.inv)?cur.inv.slice():Object.values(cur.inv||{});
    if(c.t==='stars')cur.stars=Math.max(0,(cur.stars|0)+(c.n|0));
    else if(c.t==='give'&&ITEMS[c.id]){
      let u=inv.reduce((m,e)=>Math.max(m,e.uid|0),0)+1;const n=Math.min(Math.max(c.n|0,1),50);
      for(let i=0;i<n;i++)inv.push({id:c.id,uid:u++});
    }
    else if(c.t==='take')inv=inv.filter(e=>!(e.uid===c.u&&e.id===c.id));
    else if(c.t==='takeall')inv=[];
    else if(c.t==='wipe'){cur.stars=0;inv=[]}
    cur.inv=inv;cur.val=iv(inv);
    cur.ac=Object.assign({},cur.ac,{[key]:1});
    applied=true;
    return cur;
  },undefined,false);
  return !!(r.committed&&r.snapshot.exists()&&applied);
}
async function admOp(k,c,msg){
  if(!ON.ready)return toast('🌐 Онлайн ще не готовий');

const MAP={};DICT.forEach(r=>MAP[r[0]]=r);
const KEYS=Object.keys(MAP).sort((a,b)=>b.length-a.length);
const rxe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
let RX;
try{RX=new RegExp('(?<![\\u0400-\\u04FF\\u02BC])(?:'+KEYS.map(rxe).join('|')+')(?![\\u0400-\\u04FF\\u02BC])','g')}
catch(e){RX=new RegExp(KEYS.map(rxe).join('|'),'g')}
const trStr=s=>LANG==='uk'?s:String(s).replace(RX,m=>{const r=MAP[m];return (r&&r[IX[LANG]])||m});

const ORIG=new WeakMap();
const skip=n=>{const p=n.parentElement;return !p||!!p.closest('[data-nt],.pfx,script,style,textarea')};
function trNode(n){
  const v=n.nodeValue;if(!v||!v.trim()||skip(n))return;
  const rec=ORIG.get(n),base=(rec&&v===rec.t)?rec.o:v,out=LANG==='uk'?base:trStr(base);
  if(out!==v)n.nodeValue=out;
  ORIG.set(n,{o:base,t:out});
}
function trAttrs(root){
  if(!root.querySelectorAll)return;
  root.querySelectorAll('[placeholder]').forEach(e=>{
    if(e.dataset.ph0===undefined)e.dataset.ph0=e.getAttribute('placeholder');
    const o=e.dataset.ph0;e.setAttribute('placeholder',LANG==='uk'?o:trStr(o));
  });
}
function textNodes(root){
  const L=[];const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode()))L.push(n);return L;
}
function walk(root){
  if(root.nodeType===3){trNode(root);return}
  if(root.nodeType!==1)return;
  textNodes(root).forEach(trNode);trAttrs(root);
}

const cleanN=n=>String(n==null?'':n).replace(/[\u2063\u2064<>&"']/g,'').trim().slice(0,12);

const vis3=P=>{const o={};for(const k in P){const f=ON.fl&&ON.fl[k];if(f&&(f.hide||f.ban))continue;const p=P[k];o[k]=(p&&p.pfx&&p.pfx.n&&p.name)?Object.assign({},p,{name:p.name+mk(p.pfx)}):p}return o};

const MKR=/\u2063([^\u2063\u2064]*)\u2064([^\u2063]*)\u2063/g;
function decoNode(t){
  const v=t.nodeValue;if(!v||v.indexOf(SEP)<0)return;
  const p=t.parentNode;if(!p)return;
  if(/^(OPTION|TEXTAREA|TITLE|SCRIPT|STYLE)$/.test(p.nodeName)){t.nodeValue=v.replace(MKR,(m,c,n)=>' ['+n+']');return}
  const f=document.createDocumentFragment();let last=0,m;MKR.lastIndex=0;
  while((m=MKR.exec(v))){
    if(m.index>last)f.appendChild(document.createTextNode(v.slice(last,m.index)));
    const s=document.createElement('span');s.className='pfx';s.style.setProperty('--c',okCol(m[1]));s.textContent=m[2];f.appendChild(s);
    last=MKR.lastIndex;
  }
  if(last<v.length)f.appendChild(document.createTextNode(v.slice(last)));
  p.replaceChild(f,t);
}
function decoTree(n){
  if(n.nodeType===3){decoNode(n);return}
  if(n.nodeType!==1)return;
  textNodes(n).forEach(t=>{if(t.nodeValue&&t.nodeValue.indexOf(SEP)>=0)decoNode(t)});
}

/* один спостерігач: плашки префіксів + переклад */
new MutationObserver(ms=>{
  ms.forEach(m=>{
    if(m.type==='characterData'){decoNode(m.target);trNode(m.target)}
    else m.addedNodes.forEach(n=>{decoTree(n);walk(n)});
  });
}).observe(document.body,{childList:true,subtree:true,characterData:true});
walk(document.body);

window.pxEquip=function(id){
  if(id&&!ON.pxo[id])return;
  S.pfxAct=id;save();toast(id?'🏷️ Префікс одягнено':'Префікс знято');mRender();

window.pxCreate=async function(){
  if(!isA()||!ON.ready)return;
  const n=cleanN(($('px-n')||{}).value),c=okCol(($('px-c')||{}).value),p=Math.max(0,parseInt(($('px-p')||{}).value)||0);
  if(!n)return toast('Введи назву');
  try{await ON.db.collection('prefixes').add({name:n,color:c,price:p,by:ON.uid,ts:Date.now()});toast('✅ Префікс створено')}
  catch(e){toast('❌ Помилка (перевір правила бази для prefixes)')}

window.pxPrice=async function(id){
  if(!isA())return;const d=ON.pfxs[id];if(!d)return;
  const v=prompt('Нова ціна ⭐ (0 = не продавати)',d.price|0);if(v===null)return;
  try{await firebase.database().ref('prefixes/'+id+'/price').set(Math.max(0,parseInt(v)||0));toast('✅ Ціну змінено')}
  catch(e){toast('❌ Помилка')}
};
window.pxDel=async function(id){
  if(!isA()||!confirm('Видалити цей префікс?'))return;
  try{await firebase.database().ref('prefixes/'+id).remove();toast('🗑 Видалено')}
  catch(e){toast('❌ Помилка')}
};
window.pxGive=async function(on){
  if(!isA()||!ON.ready)return;
  const u=($('px-u')||{}).value,id=($('px-s')||{}).value;
  if(!u||!id)return toast('Обери гравця і префікс');
  const ref=firebase.database().ref('pxown/'+u+'/'+id);
  try{
    if(on)await ref.set({ts:Date.now(),how:'gift',by:ON.uid});else await ref.remove();
    toast(on?'🎁 Префікс видано':'↩️ Префікс забрано');
  }catch(e){toast('❌ Помилка (перевір правила бази для pxown)')}
};

function pxShop(){
  const L=Object.entries(ON.pfxs).filter(([id,d])=>d&&d.name&&(d.price|0)>0).sort((a,b)=>a[1].price-b[1].price);
  if(!L.length)return '';
  const nick=esc((users()[ME]||{}).n||'');
  return `<div class="glass rounded-3xl p-4 space-y-2 mb-3"><h2 class="text-xs font-black tracking-widest text-fuchsia-300">🏷️ ПРЕФІКСИ В ПРОДАЖІ</h2>
  <div class="grid grid-cols-2 gap-2">${L.map(([id,d])=>{const has=!!ON.pxo[id];return `<div class="bg-slate-800/50 rounded-2xl p-2.5 flex flex-col items-center gap-1.5 text-center"><div class="text-[11px] font-black">${nick}${tagHTML(d.name,d.color)}</div>
  <button ${has?'disabled':''} onclick="pxBuy('${id}')" class="w-full py-1 rounded-lg text-[10px] font-extrabold ${has?'bg-slate-800 text-green-400':'bg-amber-400 text-black'}">${has?'✅ Вже є':'КУПИТИ ⭐ '+fmt(d.price)}</button></div>`}).join('')}</div></div>`;
}
const _mk12=mkHTML;

let PB=0;
window.pxBuy=async function(id){
  if(PB||!ON.ready)return;const d=ON.pfxs[id];
  if(!d||!((d.price|0)>0)||ON.pxo[id])return;
  if(S.stars<d.price)return toast('❌ Недостатньо Stars');
  PB=1;S.stars-=d.price;save();
  try{
    await ON.db.doc('pxown/'+ON.uid+'/'+id).set({ts:Date.now(),how:'buy'});
    confetti(25);toast('✅ Префікс куплено');
  }catch(e){S.stars+=d.price;save();toast('❌ Не вдалося купити')}
  PB=0;
};

const _ob12=onlineBoot;
onlineBoot=async function(){
  const r=await _ob12();
  if(!r)return r;
  if(!ON.db.__w12){
    ON.db.__w12=1;const d1=ON.db.doc;
    ON.db.doc=function(path){
      const ref=d1(path);
      if(path==='players/'+ON.uid){
        const s1=ref.set;
        ref.set=function(d,o){
          if(!(o&&o.merge)){const c=curP();d=Object.assign({},d,{pfx:c?{n:c.n,c:c.c}:null})}
          return s1(d,o);
        };
      }
      return ref;
    };
  }
  if(!ON.s12){
    ON.s12=1;
    ON.db.collection('prefixes').onSnapshot(s=>{
      const M={};s.docs.forEach(d=>{M[d.id]=d.data()});ON.pfxs=M;pxSync();mLive('px');mLive('mk');
    },()=>{});
    ON.db.collection('pxown/'+ON.uid).onSnapshot(s=>{
      const M={};s.docs.forEach(d=>{M[d.id]=d.data()});
      if(!ON.pxFirst)Object.keys(M).forEach(id=>{
        if(!ON.pxo[id]&&M[id]&&M[id].how==='gift'){const p=ON.pfxs[id];toast('🎁 Тобі видали префікс'+(p?': '+cleanN(p.name):''));confetti(30)}
      });
      ON.pxFirst=false;ON.pxo=M;pxSync();mLive('px');mLive('mk');
    },()=>{});
  }
  return r;
};
