<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>snCase -- NFT Case Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box}
body{background:#0b0e14;color:#fff;font-family:Inter,system-ui,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
input,select,textarea{user-select:text;-webkit-user-select:text}
.glass{background:rgba(21,28,40,.75);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08)}
.nos::-webkit-scrollbar{display:none}.nos{scrollbar-width:none}
.mask{-webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent)}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.fl{animation:fl 3s ease-in-out infinite}.tw{animation:tw 1.6s infinite;transform-origin:center;transform-box:fill-box}
.rc{transition:transform .2s}.rc:active{transform:scale(.97)}
.inp{width:100%;background:#0d131f;border:1px solid #232e42;border-radius:12px;padding:10px 12px;font-size:14px;color:#fff;outline:none}
.inp:focus{border-color:#22d3ee}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),110vh) rotate(720deg);opacity:.9}}
.cf{position:fixed;top:-12px;width:8px;height:14px;z-index:95;pointer-events:none;animation:cf 2.4s ease-in forwards}
@keyframes shk{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
.shk{animation:shk .5s}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tkr{display:flex;width:max-content;animation:tk 40s linear infinite}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s}
</style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col">
<header class="sticky top-0 z-40 glass px-4 py-3 flex items-center justify-between">
  <div class="flex items-center gap-2 cursor-pointer" onclick="go('home')">
    <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center font-black text-sm">sn</div>
    <span class="font-black tracking-wider text-base text-cyan-200">snCase</span>
  </div>
  <div class="flex items-center gap-2 text-xs font-black">
    <div class="bg-slate-800/80 border border-slate-700 px-2.5 py-1 rounded-full">🪙 <span id="b-coins"></span></div>
    <div class="bg-amber-500/20 border border-amber-500/40 px-2.5 py-1 rounded-full text-amber-300">⭐ <span id="b-stars"></span></div>
  </div>
</header>
<main id="main" class="flex-1 px-4 py-4 pb-28"></main>
<nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-40 glass px-1 py-2 flex justify-around" style="padding-bottom:calc(.5rem + env(safe-area-inset-bottom,0px))">
  <button id="n-home" onclick="go('home')" class="relative flex flex-col items-center text-[10px] font-bold px-2">📦<span>КЕЙСИ</span></button>
  <button id="n-games" onclick="go('games')" class="relative flex flex-col items-center text-[10px] font-bold px-2">🎡<span>СПІН</span></button>
  <button id="n-trade" onclick="go('trade')" class="relative flex flex-col items-center text-[10px] font-bold px-2">🔁<span>ТРЕЙД</span><b id="tbadge" style="display:none" class="absolute -top-1 -right-1 min-w-[16px] h-4 px-1 rounded-full bg-red-500 text-white text-[9px] items-center justify-center">0</b></button>
  <button id="n-top" onclick="go('top')" class="relative flex flex-col items-center text-[10px] font-bold px-2">🏆<span>ТОП</span></button>
  <button id="n-bonuses" onclick="go('bonuses')" class="relative flex flex-col items-center text-[10px] font-bold px-2">🎁<span>БОНУСИ</span></button>
  <button id="n-profile" onclick="go('profile')" class="relative flex flex-col items-center text-[10px] font-bold px-2">👤<span>ІНВЕНТАР</span></button>
</nav>
<div id="ov" style="display:none" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md items-center justify-center p-4">
  <div id="mc" class="w-full max-w-sm bg-[#151c28] border border-[#232e42] rounded-3xl p-6 text-center transition-all duration-200 scale-95 opacity-0"></div>
</div>
<div id="auth" class="fixed inset-0 z-[70] bg-[#0b0e14] overflow-y-auto" style="display:none"></div>

function odds(c){
  const cnt={};c.items.forEach(i=>{const it=ITEMS[i];if(it.sw)return;cnt[it.rarity]=(cnt[it.rarity]||0)+1});
  const w=c.items.map(i=>{const it=ITEMS[i];return it.sw||RW[it.rarity]/cnt[it.rarity]}),t=w.reduce((a,b)=>a+b,0);
  return c.items.map((i,k)=>({...ITEMS[i],w:w[k],chance:(w[k]/t*100)}));
}
function roll(c){
  const o=odds(c);let r=Math.random()*o.reduce((s,i)=>s+i.w,0);
  for(const i of o){if(r<i.w)return i;r-=i.w}return o[0];
}

const NRE=/^[A-Za-z0-9_А-Яа-яІіЇїЄєҐґ]{3,16}$/;
const canSub=!!(window.crypto&&crypto.subtle&&window.TextEncoder);
function cyrb(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,ch;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
async function hashPw(salt,pw,m){
  const t=salt+':'+pw;
  if(m==='s'){if(!canSub)return null;const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  return cyrb(t)+cyrb(t.split('').reverse().join(''));
}

async function doAuth(){
  const n=$('a-name').value.trim(),p=$('a-pw').value,k=n.toLowerCase(),er=$('a-err'),fail=m=>{er.textContent=m};
  er.textContent='';
  if(AM==='reg'){
    if(!NRE.test(n))return fail('Імʼя: 3–16 символів (літери, цифри, _)');
    if(p.length<4)return fail('Пароль має бути не коротший за 4 символи');
    if(p!==$('a-pw2').value)return fail('Паролі не збігаються');
    if(users()[k])return fail('Таке імʼя вже зайняте');
    const s=Math.random().toString(36).slice(2)+Date.now().toString(36),m=canSub?'s':'f',h=await hashPw(s,p,m),U=users();
    if(U[k])return fail('Таке імʼя вже зайняте');
    let d=DEF();
    const old=LSget('STARSCASE_V2',null);
    if(old&&!Object.values(U).some(u=>!u.bot)){
      d=Object.assign(d,{stars:old.stars,coins:old.coins,inv:old.inv||[],opened:old.opened||0,cd:old.cd||{},wheel:old.wheel||0,bonus:old.bonus||{}});
      try{localStorage.removeItem('STARSCASE_V2')}catch(e){}
    }
    U[k]={n,s,h,m,d};LSset('sn_users',U);enter(k);
  }else{
    const u=users()[k];
    if(!u||u.bot||!u.h)return fail('Невірне імʼя або пароль');
    const h=await hashPw(u.s,p,u.m);
    if(h===null)return fail('Цей акаунт створено в захищеному режимі -- відкрийте гру через https');
    if(h!==u.h)return fail('Невірне імʼя або пароль');
    enter(k);
  }
}

async function tAct(id,mode){
  const ref=ON.db.doc('trades/'+id);let msg='';
  try{
    const l=await ref.acquire({holder:ON.uid,ttlMs:15000});
    if(!l.acquired)return toast('⏳ Спробуй ще раз за мить');
    const t=(await ref.get()).data();

    else if(mode==='cancel'){if(t.from!==ON.uid)return;await ref.update({st:'cancelled'});msg='Скасовано'}
    else if(t.to!==ON.uid)return;
    else if(mode==='decline'){await ref.update({st:'declined'});msg='Відхилено'}

      const ok=t.ask.every(a=>S.inv.some(x=>x.uid===a.uid&&x.id===a.id))&&S.stars+(t.gs|0)>=(t.stars|0);
      if(!ok){await ref.update({st:'declined'});msg='❌ Бракує предметів або Stars -- офер відхилено'}

        S.inv=S.inv.filter(x=>!t.ask.some(a=>a.uid===x.uid));
        let n=nid(S);t.give.forEach(g=>S.inv.push({id:g,uid:n++}));

        await ref.update({st:'accepted'});msg='✅ Обмін виконано'

  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#ugw)" stroke-width="14" stroke-dasharray="${len} ${C}" transform="rotate(-90 100 100)" style="filter:drop-shadow(0 0 5px #84cc16)"/>
  <circle cx="100" cy="100" r="66" fill="#10151f"/></svg>
  <div id="uptr" class="absolute inset-0" style="transform:rotate(${UP.rot}deg)"><div style="position:absolute;top:2px;left:50%;transform:translateX(-50%);color:#facc15;font-size:22px;line-height:1;filter:drop-shadow(0 0 4px #facc15)">▼</div></div>
  <div class="absolute inset-0 flex flex-col items-center justify-center gap-0.5">
   ${base&&tgt?`<div class="flex items-center gap-1"><div class="w-9 h-9">${art(base)}</div><span class="text-xs">➜</span><div class="w-9 h-9">${art(tgt)}</div></div>`:'<div class="text-[10px] font-black text-slate-500">ОБЕРИ ПРЕДМЕТ</div>'}
   <div class="text-2xl font-black" style="color:${col}">${ch}%</div><div class="text-[9px] font-bold" style="color:${col}">${lbl}</div></div></div>`;
  return `<div id="up" class="glass p-4 rounded-3xl space-y-3 mt-4"><div class="text-center"><h2 class="text-sm font-black tracking-widest text-fuchsia-400">⚡ АПГРЕЙД</h2><p class="text-[10px] text-slate-400">Виграєш -- отримаєш дорожчий предмет, програєш -- згорить</p></div>
  <div class="flex justify-center gap-2">${[2,3,5,10].map(x=>`<button onclick="UP.mult=${x};upRender()" class="px-3 py-1 rounded-xl text-xs font-black ${UP.mult===x?'bg-fuchsia-500 text-black':'bg-slate-800 text-slate-300'}">X${x}</button>`).join('')}</div>
  ${gauge}
  ${base&&tgt?`<div class="text-center text-[11px] font-black"><span class="text-slate-300">${esc(base.name)} ⭐${base.val}</span> → <span class="text-amber-300">${esc(tgt.name)} ⭐${tgt.val.toLocaleString()}</span></div>
  <button id="upbtn" onclick="upGo()" class="w-full py-3 rounded-2xl bg-gradient-to-r from-fuchsia-500 to-purple-600 text-black font-black text-xs uppercase active:scale-95 transition">РИЗИКНУТИ 🎲</button>`:''}
  ${inv.length?`<div class="grid grid-cols-4 gap-1.5 max-h-44 overflow-y-auto nos">${inv.map(e=>tcard(ITEMS[e.id],e.uid===UP.sel,`UP.sel=${e.uid};upRender()`)).join('')}</div>`:'<div class="text-center text-[10px] text-slate-500">Відкрий кейс -- і повертайся сюди</div>'}</div>`;
};
upRender=function(){if(UP.busy)return;const e=$('up');if(e)e.outerHTML=upHTML()};
upGo=function(){
  if(UP.busy||S.spin)return;
  const idx=S.inv.findIndex(e=>e.uid===UP.sel);if(idx<0)return;
  const base=ITEMS[S.inv[idx].id],tgt=upTarget(base.val,UP.mult);if(!tgt)return;
  const ch=upCh(UP.mult),win=Math.random()*100<ch,za=ch*3.6,ang=win?4+Math.random()*(za-8):za+4+Math.random()*(352-za);
  UP.busy=S.spin=true;S.inv.splice(idx,1);save();
  const b=$('upbtn');if(b){b.disabled=true;b.classList.add('opacity-50')}
  const p=$('uptr');UP.rot=UP.rot-UP.rot%360+1800+ang;
  p.style.transition='transform 4.5s cubic-bezier(.12,.8,.15,1)';p.style.transform=`rotate(${UP.rot}deg)`;
  AU.tone(220,0,1.2,'sawtooth',.05);
  for(let i=1;i<=32;i++)setTimeout(()=>AU.tick(),4500*Math.pow(i/32,.55));
  setTimeout(()=>{
    UP.busy=S.spin=false;UP.sel=null;
    if(win){S.inv.push({id:tgt.id,uid:nid(S)});save();AU.win(tgt.rarity);confetti(60);if(RAR.indexOf(tgt.rarity)>=3)shake();toast('🔥 УСПІХ! '+tgt.name);addXP(40)}
    else{AU.tone(110,0,.6,'square',.1);shake();toast('💥 Не пощастило -- предмет згорів');addXP(10)}
    upRender();
  },4700);
};

/* ---------- ЦЕНТР ВІДЕОКАРТ ---------- */
const GPUS=[['g1','Відюха-гівняшка',10,'#8b5a2b'],['g2','GT 710',30,'#64748b'],['g3','GTX 1060',70,'#22c55e'],['g4','RTX 2070',150,'#3b82f6'],['g5','RTX 3080',300,'#a855f7'],['g6','RTX 4090',500,'#f59e0b'],['g7','RTX 5090 ULTRA',777,'#ef4444']];
const gInc=p=>p*20; /* ⭐ за годину */
const gRate=()=>GPUS.reduce((s,g)=>s+((S.gpu&&S.gpu[g[0]])||0)*gInc(g[2]),0);
function gpuArt(c){
  const fan=x=>`<circle cx="${x}" cy="28" r="14" fill="#0b0e14" stroke="${c}" stroke-width="2"/><g class="spn"><circle cx="${x}" cy="28" r="11" fill="none"/><path d="M${x},28V17M${x},28l9.5,5.5M${x},28l-9.5,5.5" stroke="${c}" stroke-width="3.5" stroke-linecap="round" fill="none"/></g><circle cx="${x}" cy="28" r="3" fill="${c}"/>`;
  return `<svg viewBox="0 0 100 60" class="w-full h-full"><rect x="4" y="8" width="92" height="40" rx="5" fill="#1b2230" stroke="${c}" stroke-width="2.5"/>${fan(30)}${fan(70)}<rect x="10" y="48" width="80" height="5" fill="#d4a017"/><rect x="2" y="12" width="4" height="32" fill="#64748b"/></svg>`;
}
function renderGpu(m){
  const r=gRate(),own=S.gpu||{};
  m.innerHTML=`<div class="space-y-4"><div class="text-center"><h2 class="text-sm font-black tracking-widest text-lime-400">🖥️ ЦЕНТР ВІДЕОКАРТ</h2><p class="text-[10px] text-slate-400">Відюхи фармлять ⭐ навіть коли тебе нема (до 24 год)</p></div>
  <div class="glass p-4 rounded-3xl space-y-3"><div class="flex justify-between items-center text-xs font-black"><span class="text-lime-300">💾 VD: ${(S.vd||0).toLocaleString()}</span><span class="text-amber-300">⚙️ ${r.toLocaleString()} ⭐/год</span></div>
  <div class="text-[10px] font-black text-slate-400 text-center">КОНВЕРТЕР · 1 VD = 1 000 ⭐</div>
  <div class="flex gap-2"><input id="cv" type="number" min="1" class="inp" placeholder="Кількість VD" oninput="cvp()"><div id="cvp" class="shrink-0 self-center text-[11px] font-black text-amber-300">⭐ 0</div></div>
  <div class="grid grid-cols-4 gap-1.5">${[1,10,100].map(n=>`<button onclick="cvSet(${n})" class="py-1 rounded-lg bg-slate-800 text-[10px] font-black">${n}</button>`).join('')}<button onclick="cvSet(Math.floor(S.stars/1000))" class="py-1 rounded-lg bg-slate-800 text-[10px] font-black">MAX</button></div>
  <div class="grid grid-cols-2 gap-2"><button onclick="conv('buy')" class="py-2.5 rounded-xl bg-lime-400 text-black font-black text-xs">⭐ → VD</button><button onclick="conv('sell')" class="py-2.5 rounded-xl bg-amber-400 text-black font-black text-xs">VD → ⭐</button></div></div>
  <div class="grid grid-cols-2 gap-2.5">${GPUS.map(([id,n,p,c])=>{const ok=(S.vd||0)>=p;return `<div class="glass rounded-2xl p-2.5 flex flex-col items-center text-center" style="border-color:${c}66"><div class="w-24 h-14">${gpuArt(c)}</div><div class="text-[11px] font-black mt-1">${n}</div><div class="text-[9px] text-lime-300 font-bold">+${gInc(p).toLocaleString()} ⭐/год</div><div class="text-[9px] text-slate-400">Є: ${own[id]||0}</div><button onclick="buyGpu('${id}')" class="w-full mt-1.5 py-1.5 rounded-lg text-[10px] font-extrabold ${ok?'bg-lime-400 text-black':'bg-slate-800 text-slate-500'}">💾 ${p} VD</button></div>`}).join('')}</div></div>`;
}
renderTrade=function(m){renderGpu(m)};
function cvVal(){return Math.max(0,parseInt(($('cv')||{}).value)||0)}
function cvp(){$('cvp').textContent='⭐ '+(cvVal()*1000).toLocaleString()}
function cvSet(n){$('cv').value=Math.max(0,n);cvp()}
function conv(d){
  const n=cvVal();if(!n)return toast('Введи кількість VD');
  if(d==='buy'){if(S.stars<n*1000)return toast('❌ Недостатньо Stars');S.stars-=n*1000;S.vd=(S.vd||0)+n;toast('💾 +'+n+' VD')}
  else{if((S.vd||0)<n)return toast('❌ Недостатньо VD');S.vd-=n;S.stars+=n*1000;toast('⭐ +'+(n*1000).toLocaleString())}
  save();renderGpu($('main'));
}
function buyGpu(id){
  const g=GPUS.find(x=>x[0]===id);if(!g)return;
  if((S.vd||0)<g[2])return toast('❌ Недостатньо VD');
  farm();S.vd-=g[2];S.gpu=S.gpu||{};S.gpu[id]=(S.gpu[id]||0)+1;S.lastFarm=Date.now();
  save();toast('🖥️ Куплено: '+g[1]);renderGpu($('main'));
}

/* ---------- ФАРМ (в тому числі офлайн, до 24 год) ---------- */
let ENT=Date.now();
function farm(){
  if(!ME)return;
  if(!ON.ready&&Date.now()-ENT<8000)return; /* чекаємо, поки підтягнеться онлайн-баланс */
  const now=Date.now(),r=gRate();
  if(!S.lastFarm||!r){S.lastFarm=now;return}
  const dt=Math.min(now-S.lastFarm,864e5),g=Math.floor(r*dt/36e5);
  if(g<1)return;
  S.lastFarm=now;S.stars+=g;save();
  if(dt>300000)toast('🖥️ Відюхи нафармили ⭐ +'+g.toLocaleString());
}
setInterval(farm,5000);

/* ---------- збереження нових полів (+ виправлено збереження XP/серії) ---------- */
const _save2=save;
save=function(){
  _save2();
  if(ME){try{const U=users();if(U[ME]){Object.assign(U[ME].d,{xp:S.xp||0,streak:S.streak||0,lastDay:S.lastDay||'',gpu:S.gpu||{},vd:S.vd||0,lastFarm:S.lastFarm||0});LSset('sn_users',U)}}catch(e){}}
};
const _en2=enter;
enter=function(k){S.gpu={};S.vd=0;S.lastFarm=0;S.xp=0;S.streak=0;S.lastDay='';ENT=Date.now();_en2(k)};
/* ============ INIT ============ */
hdr();
(function(){const s=LSget('sn_sess',null),u=s&&users()[s];if(u&&!u.bot)enter(s);else showAuth('login')})();
</script>
